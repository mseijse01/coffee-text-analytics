[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-text-analytics"
version = "1.0.0"
description = "Text analytics and ML pipeline for predicting coffee review ratings"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Marcelo Seijas", email = "marcelo.seijas@erasmusuniversity.nl"},
]
keywords = ["machine-learning", "nlp", "text-analytics", "coffee", "regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.4.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pyarrow>=10.0.0",
    "plotly>=5.0.0",
    "nltk>=3.7.0",
    "gensim>=4.1.0",
    "transformers>=4.18.0",
    "torch>=1.11.0",
    "xgboost>=1.5.0",
    "shap>=0.40.0",
    "mlflow>=2.0.0",
    "optuna>=3.0.0",
    "polars>=0.15.0",
    "boto3>=1.26.0",
    "minio>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/mseijse01/coffee-text-analytics"
Documentation = "https://github.com/mseijse01/coffee-text-analytics#readme"
Repository = "https://github.com/mseijse01/coffee-text-analytics.git"
Issues = "https://github.com/mseijse01/coffee-text-analytics/issues"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "isort>=5.0",
    "flake8>=3.9",
    "mypy>=1.0",
    "pre-commit>=2.20",
]

[project.scripts]
coffee-analytics = "main:main"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | mlruns
  | cache
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
known_first_party = ["src"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "src.data.loader",
    "src.data.preprocessing",
    "src.features.feature_manager",
    "src.models.regressors",
    "src.models.evaluator",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"
markers = [
    "slow: marks tests as slow",
    "heavy_ml: marks tests that require ML models",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "edge_case: marks edge case tests",
    "error_handling: marks error handling tests",
    "mlflow: marks tests requiring MLflow",
    "methodology: marks methodology validation tests",
    "performance: marks performance tests",
    "contract: marks API contract tests",
]
