version: '3.8'

services:
  # PostgreSQL database for MLflow backend
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mlflow_network
    restart: unless-stopped

  # MinIO for S3-compatible artifact storage
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio_access_key
      MINIO_ROOT_PASSWORD: minio_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - mlflow_network
    restart: unless-stopped

  # MLflow tracking server
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:mlflow_password@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow-artifacts/
      - AWS_ACCESS_KEY_ID=minio_access_key
      - AWS_SECRET_ACCESS_KEY=minio_secret_key
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
      # Dual-mode data loading configuration
      - ENVIRONMENT=container
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio_access_key
      - S3_SECRET_KEY=minio_secret_key
      - S3_BUCKET=mlflow
      - DATASET_S3_KEY=datasets/coffee_clean.csv
    ports:
      - "5555:5000"
    depends_on:
      - postgres
      - minio
    networks:
      - mlflow_network
    restart: unless-stopped
    volumes:
      - ./mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server 
      --backend-store-uri postgresql://mlflow:mlflow_password@postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000

  # MLflow Model Registry UI (optional - advanced model management)
  mlflow-registry:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://mlflow:mlflow_password@postgres:5432/mlflow
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=s3://mlflow-artifacts/
      - AWS_ACCESS_KEY_ID=minio_access_key
      - AWS_SECRET_ACCESS_KEY=minio_secret_key
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    ports:
      - "5556:5001"
    depends_on:
      - postgres
      - minio
    networks:
      - mlflow_network
    restart: unless-stopped
    command: >
      mlflow ui 
      --backend-store-uri postgresql://mlflow:mlflow_password@postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5001

  # Coffee Text Analytics Training Pipeline
  coffee-training:
    build:
      context: ..
      dockerfile: Dockerfile.training
    environment:
      # Dual-mode data loading configuration
      - ENVIRONMENT=container
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio_access_key
      - S3_SECRET_KEY=minio_secret_key
      - S3_BUCKET=mlflow
      - DATASET_S3_KEY=datasets/coffee_clean.csv
      # MLflow tracking configuration
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minio_access_key
      - AWS_SECRET_ACCESS_KEY=minio_secret_key
      - MLFLOW_S3_IGNORE_TLS=true
    depends_on:
      - postgres
      - minio
      - mlflow
    networks:
      - mlflow_network
    volumes:
      - training_output:/app/output
      - training_models:/app/models
    # Run once and exit (not a service)
    restart: "no"
    profiles:
      - training  # Only start when explicitly requested

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  training_output:
    driver: local
  training_models:
    driver: local

networks:
  mlflow_network:
    driver: bridge 