[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_return_any = False
warn_unused_ignores = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
no_strict_optional = True

# Ignore errors in imported modules - we only check the 5 core files themselves
follow_imports = skip
follow_imports_for_stubs = True

[mypy-tests.*]
ignore_errors = True

[mypy-src.experiment.*]
ignore_errors = True

[mypy-src.visualization.*]
ignore_errors = True

[mypy-src.utils.*]
ignore_errors = True

[mypy-src.config.*]
ignore_errors = True

[mypy-src.features.tfidf_extractor]
ignore_errors = True

[mypy-src.features.bert_extractor]
ignore_errors = True

[mypy-src.features.topic_extractor]
ignore_errors = True

[mypy-src.features.sentiment_extractor]
ignore_errors = True

[mypy-src.features.categorical_encoder]
ignore_errors = True

[mypy-src.features.feature_selector]
ignore_errors = True

[mypy-src.models.mnir]
ignore_errors = True
