[tool:pytest]
minversion = 6.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    -m "not slow and not heavy_ml"
    --disable-warnings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    methodology: marks tests as methodology validation tests
    performance: marks tests as performance validation tests
    mlflow: marks tests as MLflow integration tests
    error_handling: marks tests as error handling tests
    contract: marks tests as contract validation tests
    edge_case: marks tests as edge case tests
    heavy_ml: marks tests that load heavy ML models (deselect for speed)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
    ignore::RuntimeWarning
    ignore::UserWarning:sklearn.*
    ignore::FutureWarning:sklearn.*
    ignore::FutureWarning:transformers.*
    ignore::UserWarning:transformers.*
    ignore::DeprecationWarning:tensorflow.*
    ignore::UserWarning:tensorflow.*
    ignore::FutureWarning:tensorflow.*
    ignore::DeprecationWarning:torch.*
    ignore::UserWarning:torch.*
    ignore::FutureWarning:polars.*
    ignore::DeprecationWarning:polars.*
    ignore::UserWarning:gensim.*
    ignore::DeprecationWarning:gensim.*
    ignore::PendingDeprecationWarning:gensim.*
    ignore::pytest.PytestUnknownMarkWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore:.*deprecated.*:DeprecationWarning
    ignore:.*Precision loss.*:RuntimeWarning
    ignore:.*divide by zero.*:RuntimeWarning
    ignore:.*Objective did not converge.*:UserWarning
    ignore:.*return_all_scores.*:DeprecationWarning
    ignore:.*Row orientation inferred.*:UserWarning
    ignore:.*ml_dtypes.float8_e4m3b11.*:DeprecationWarning
    ignore:.*class-based.*config.*deprecated.*:DeprecationWarning
timeout = 300
log_cli = false
log_cli_level = ERROR
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S 